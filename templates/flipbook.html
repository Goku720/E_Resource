<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
<title>AI PDF Viewer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --top:56px;--nav:64px;
  --bg:#0f172a;--surf:#1e293b;--surf2:#273548;
  --bdr:rgba(255,255,255,0.08);
  --acc:#6366f1;--acc2:#8b5cf6;
  --white:#f1f5f9;--muted:#64748b;
  --r:12px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--white);touch-action:pan-x pan-y pinch-zoom;}

/* ── TOP BAR ── */
#topBar{
  position:fixed;top:0;left:0;right:0;z-index:500;height:var(--top);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:rgba(15,23,42,0.97);border-bottom:1px solid var(--bdr);
  backdrop-filter:blur(20px);
  transition:transform .3s ease,opacity .3s ease;
}
#topBar.hidden{transform:translateY(-100%);opacity:0;pointer-events:none;}
.tb-left{display:flex;align-items:center;gap:8px;}
.back-btn{
  display:flex;align-items:center;gap:5px;
  color:var(--white);text-decoration:none;
  background:var(--surf);border:1px solid var(--bdr);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;
  transition:background .15s;
}
.back-btn:hover{background:var(--surf2);}
#bookTitle{
  font-size:13px;font-weight:600;color:var(--white);
  max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pg-badge{
  background:var(--surf);border:1px solid var(--bdr);
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);
}
#pgBadge span{color:var(--white);}

/* ── PREVIEW BANNER ── */
#pvBanner{
  position:fixed;top:calc(var(--top)+8px);left:50%;transform:translateX(-50%);
  z-index:600;background:#fbbf24;color:#1c1917;
  padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;display:none;
}

/* ── PDF STAGE ── */
#stage{
  position:fixed;top:var(--top);left:0;right:0;bottom:var(--nav);
  overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);
}
#stage.fs{top:0;bottom:0;}
#shell{
  display:flex;
  width:100%;
  min-height:100%;
  justify-content:center;   /* centers horizontally */
  align-items:flex-start;   /* keeps it top aligned */
  padding:14px 0 20px;
}
#pageFrame{
  position:relative;flex-shrink:0;background:#fff;
  border-radius:8px;overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,0.05);
}
#pdfCanvas{display:block;}

/* ── TEXT LAYER ── */
#tl{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:auto;
  z-index:2;
  line-height:1;
}
#tl span,
#tl br{
  color:transparent;
  position:absolute;
  white-space:pre;
  cursor:text;
  transform-origin:0% 0%;
}
#tl ::selection{
  background:rgba(99,102,241,.35);
}

/* ── NAV BAR ── */
#navBar{
  position:fixed;bottom:0;left:0;right:0;z-index:500;height:var(--nav);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;
  background:rgba(15,23,42,0.97);border-top:1px solid var(--bdr);
  backdrop-filter:blur(20px);
  transition:transform .3s ease,opacity .3s ease;
}
#navBar.hidden{transform:translateY(100%);opacity:0;pointer-events:none;}

.icobtn{
  width:42px;height:42px;flex-shrink:0;
  border:1px solid var(--bdr);border-radius:50%;
  background:var(--surf);color:var(--white);
  font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
}
.icobtn:hover{background:var(--surf2);}
.icobtn:active{transform:scale(.92);}
.icobtn:disabled{opacity:.3;cursor:not-allowed;}

.pg-ctrl{
  display:flex;align-items:center;gap:6px;
  flex:1;justify-content:center;
  font-size:13px;color:var(--muted);
}
#pgInput{
  width:42px;text-align:center;
  background:var(--surf);border:1px solid var(--bdr);
  color:var(--white);border-radius:8px;
  padding:5px 4px;font-size:13px;font-weight:700;
}
#pgInput:focus{outline:none;border-color:var(--acc);}

.zoom-row{display:flex;align-items:center;gap:4px;}
.zbtn{
  width:34px;height:34px;border:1px solid var(--bdr);border-radius:8px;
  background:var(--surf);color:var(--white);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.zbtn:hover{background:var(--surf2);}
#zlabel{font-size:11px;color:var(--muted);min-width:36px;text-align:center;}

#aiBtn{
  width:42px;height:42px;flex-shrink:0;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(99,102,241,.5);
  transition:transform .15s,box-shadow .15s;
}
#aiBtn:hover{transform:scale(1.08);box-shadow:0 6px 22px rgba(99,102,241,.65);}

/* ── AI DRAWER ── */
#overlay{display:none;position:fixed;inset:0;z-index:440;background:rgba(0,0,0,.45);}
#overlay.on{display:block;}
#aiDrawer{
  position:fixed;bottom:var(--nav);left:0;right:0;z-index:450;
  background:var(--surf);border-top:1px solid var(--bdr);
  border-radius:var(--r) var(--r) 0 0;
  padding:16px 14px 18px;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
#aiDrawer.on{transform:translateY(0);}
.dr-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ti{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:rgba(255,255,255,0.04);border:1px solid var(--bdr);
  border-radius:10px;padding:10px 6px;cursor:pointer;
  transition:background .15s,transform .1s;
}
.ti:hover{background:rgba(255,255,255,.09);}
.ti:active{transform:scale(.94);}
.ti-icon{font-size:20px;line-height:1;}
.ti-label{font-size:10px;color:var(--muted);font-weight:600;text-align:center;}

/* ── MODAL ── */
.modal{
  display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.72);padding:10px;
  align-items:flex-end;justify-content:center;
}
.modal.on{display:flex;}
.msheet{
  background:var(--surf);border-radius:18px 18px 14px 14px;
  width:100%;max-width:680px;max-height:92vh;overflow-y:auto;
  border:1px solid var(--bdr);
}
.mhdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 14px;
  position:sticky;top:0;background:var(--surf);
  border-bottom:1px solid var(--bdr);z-index:1;
}
.mhdr h2{font-size:15px;font-weight:700;}
.mcls{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.08);border:none;
  color:var(--white);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.mbody{padding:14px 18px 22px;}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.chip{background:rgba(99,102,241,.14);color:#a5b4fc;border:1px solid rgba(99,102,241,.28);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;}

/* quick btns */
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.qb{padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);color:var(--white);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;}
.qb:hover{background:rgba(255,255,255,.12);}
.qb.on{background:var(--acc);border-color:var(--acc);}

/* answer */
.abox{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:10px;padding:14px;font-size:14px;line-height:1.75;white-space:pre-wrap;min-height:70px;color:var(--white);}

/* ask row */
.askrow{display:flex;gap:8px;margin:12px 0;}
.askrow input{flex:1;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--bdr);color:var(--white);font-size:14px;}
.askrow input:focus{outline:none;border-color:var(--acc);}
.askrow input::placeholder{color:var(--muted);}
.askbtn{padding:10px 16px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}

/* mode tabs */
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.mt{padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;}
.mt.on{background:var(--acc);color:#fff;border-color:var(--acc);}

/* confidence */
.crow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
.cbadge{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.ch{background:rgba(34,197,94,.14);color:#86efac;}
.cm{background:rgba(234,179,8,.14);color:#fde047;}
.cl{background:rgba(239,68,68,.14);color:#fca5a5;}

/* source */
.srcbox{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.18);border-radius:10px;padding:10px 12px;font-size:13px;color:#fde68a;margin-top:10px;line-height:1.6;}

/* followups */
.fulist{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.fubtn{text-align:left;padding:9px 13px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:10px;color:var(--white);font-size:13px;cursor:pointer;transition:background .15s;}
.fubtn:hover{background:rgba(255,255,255,.1);}

/* lists */
.slist{padding-left:18px;}
.slist li{margin-bottom:5px;font-size:14px;line-height:1.6;}
.fbox,.cbox{background:rgba(0,0,0,.3);border:1px solid var(--bdr);border-radius:10px;padding:11px;font-family:'Courier New',monospace;font-size:13px;margin-top:6px;white-space:pre-wrap;overflow-x:auto;}
.loading-txt{color:var(--muted);font-style:italic;font-size:13px;}

/* ── VIDEO PANEL ── */
/* ── VIDEO PANEL ── */
#vp{
  display:none;position:fixed;
  left:10px;bottom:calc(var(--nav)+10px);z-index:600;
  width:min(380px,calc(100vw - 20px));
  max-height:68vh;overflow-y:auto;
  background:#ffffff;
  border:1px solid rgba(0,0,0,0.10);
  border-radius:16px;padding:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.18);
}
.vphdr{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(0,0,0,0.08);
}
.vphdr h3{
  font-size:15px;font-weight:700;
  color:#1a1a2e;
}
.vpcls{
  background:rgba(0,0,0,0.06);border:none;
  color:#555;font-size:18px;cursor:pointer;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.vpcls:hover{background:rgba(0,0,0,0.12);}
.vc{
  margin-bottom:16px;
  background:#f8f9fb;
  border:1px solid rgba(0,0,0,0.07);
  border-radius:12px;
  overflow:hidden;
}
.vc:last-child{margin-bottom:0;}
.vc-info{padding:10px 12px 8px;}
.vc h4{
  font-size:13px;font-weight:700;
  color:#1a1a2e;
  margin-bottom:3px;
  line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.vc p{
  font-size:11px;font-weight:600;
  color:#6366f1;
  margin-bottom:0;
  text-transform:uppercase;letter-spacing:0.05em;
}
.vc iframe{
  width:100%;height:185px;
  display:block;border:none;
}

/* ── MOBILE ── */
@media(max-width:480px){
  #bookTitle{max-width:30vw;}
  #zlabel{display:none;}
  .zoom-row{gap:2px;}
  .tool-grid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header id="topBar">
  <div class="tb-left">
    <a href="/books" class="back-btn">← Back</a>
    <div id="bookTitle">{{ pdf_name }}</div>
  </div>
  <div class="pg-badge" id="pgBadge">
    Page <span id="pgTop">1</span> / <span id="pgTot">?</span>
  </div>
</header>

<div id="pvBanner">Preview Mode — Login to read the full book</div>

<!-- PDF STAGE -->
<div id="stage">
  <div id="shell">
    <div id="pageFrame">
      <canvas id="pdfCanvas"></canvas>
      <div id="tl"></div>
    </div>
  </div>
</div>

<!-- NAV BAR -->
<nav id="navBar">
  <button class="icobtn" id="btnPrev" onclick="prevPage()" title="Previous">&#9664;</button>

  <div class="pg-ctrl">
    <input id="pgInput" type="number" min="1" value="1" onchange="jumpPage(this.value)"/>
    <span>/ <span id="pgN">?</span></span>
  </div>

  <div class="zoom-row">
    <button class="zbtn" onclick="zoomOut()" title="Zoom out">−</button>
    <span id="zlabel">100%</span>
    <button class="zbtn" onclick="zoomIn()" title="Zoom in">+</button>
  </div>

  <button class="icobtn" id="btnNext" onclick="nextPage()" title="Next">&#9654;</button>
  <button id="ttsBtn" class="icobtn" onclick="toggleTTS()" 
  aria-label="Read page aloud" aria-pressed="false" title="Read aloud (S)">
  &#128266;
  </button>
  <button id="aiBtn" onclick="toggleDrawer()" title="AI Tools">✦</button>
</nav>

<!-- AI DRAWER -->
<div id="overlay" onclick="closeDrawer()"></div>
<div id="aiDrawer">
  <div class="dr-title">AI Tools</div>
  <div class="tool-grid">
    <div class="ti" onclick="cd();showSummary()"><span class="ti-icon">✨</span><span class="ti-label">Study Helper</span></div>
    <div class="ti" onclick="cd();openAskBook()"><span class="ti-icon">💬</span><span class="ti-label">Ask Book</span></div>
    <div class="ti" onclick="cd();getVideos()"><span class="ti-icon">🎥</span><span class="ti-label">Videos</span></div>
    <div class="ti" onclick="cd();setFit('width')"><span class="ti-icon">↔</span><span class="ti-label">Fit Width</span></div>
    <div class="ti" onclick="cd();setFit('page')"><span class="ti-icon">⬜</span><span class="ti-label">Fit Page</span></div>
    <div class="ti" onclick="cd();setFit('readable')"><span class="ti-icon">📖</span><span class="ti-label">Readable</span></div>
    <!-- <div class="ti" onclick="cd();toggleUI()"><span class="ti-icon">👁</span><span class="ti-label">Hide UI</span></div> -->
    <div class="ti" onclick="cd();openGoToPage()">
    <span class="ti-icon">🔖</span>
    <span class="ti-label">Go to Page</span>
    </div>
    <div class="ti" onclick="cd();openTTSPanel()">
    <span class="ti-icon">&#128266;</span>
    <span class="ti-label">Read Aloud</span>
  </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="msheet">
    <div class="mhdr">
      <h2 id="mtitle">Panel</h2>
      <button class="mcls" onclick="closeModal()">×</button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<!-- VIDEO PANEL -->
<div id="vp">
  <div class="vphdr">
    <h3 id="vptitle">Videos</h3>
    <button class="vpcls" onclick="document.getElementById('vp').style.display='none'">×</button>
  </div>
  <div id="vpbody"><p class="loading-txt">Loading…</p></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const previewMode=JSON.parse('{{ preview | tojson | safe }}');
const pdfName="{{ pdf_name }}";

const canvas=document.getElementById("pdfCanvas");
const ctx=canvas.getContext("2d",{alpha:false});
const stage=document.getElementById("stage");
const shell=document.getElementById("shell");
const frame=document.getElementById("pageFrame");
const tlEl=document.getElementById("tl");

let pdfDoc=null,pg=1,total=0,zoom=1,fit="readable";
let rt=null,tlt=null,uiOn=true,lastTap=0,rTimer;
let sumData={},sumLoaded=false,matched=null,askMode="detailed";

if(previewMode) document.getElementById("pvBanner").style.display="block";

fetch(`/summary_json/${pdfName}`).then(r=>r.json())
  .then(d=>{sumData=d;sumLoaded=true;}).catch(()=>{});

pdfjsLib.getDocument(`/pdf/${pdfName}`).promise.then(doc=>{
  pdfDoc=doc; total=doc.numPages;
  ["pgTot","pgN"].forEach(id=>document.getElementById(id).textContent=total);
  document.getElementById("pgInput").max=total;
  renderPage(pg);
}).catch(e=>console.error(e));

/* ── SCALE ── */
function baseScale(vp){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  if(fit==="width") return sw/vp.width;
  if(fit==="page")  return Math.min(sw/vp.width,(sh-40)/vp.height);
  /* readable: target ~700px on mobile so text is comfortable */
  const mob=window.innerWidth<768;
  if(mob){ const t=Math.max(sw*1.5,700); return t/vp.width; }
  return Math.min(sw-48,960)/vp.width;
}

/* ── RENDER ── */
async function renderPage(n, speakAfter = false){
  if(previewMode&&n>3){
    alert("Preview limit. Login to continue.");
    window.location.href="/login";
    return;
  }
  if(!pdfDoc) return;

  if(rt){ try{ rt.cancel(); }catch(e){} }
  if(tlt){ try{ tlt.cancel(); }catch(e){} }

  const page = await pdfDoc.getPage(n);
  const rawVP = page.getViewport({ scale: 1 });
  const base = baseScale(rawVP);
  const final = base * zoom;

  /* device pixel ratio for sharp rendering */
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  /* CSS/display viewport */
  const vp = page.getViewport({ scale: final });

  const dw = vp.width;
  const dh = vp.height;

  /* Canvas backing store */
  canvas.width = Math.floor(dw * dpr);
  canvas.height = Math.floor(dh * dpr);
  canvas.style.width = `${dw}px`;
  canvas.style.height = `${dh}px`;

  frame.style.width = `${dw}px`;
  frame.style.height = `${dh}px`;
  shell.style.minWidth = `${dw + 32}px`;

  /* IMPORTANT: PDF.js text layer needs this */
  frame.style.setProperty("--scale-factor", final);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, dw, dh);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  rt = page.render({
    canvasContext: ctx,
    viewport: vp
  });

  try{
    await rt.promise;
  }catch(e){
    if(e?.name !== "RenderingCancelledException") console.error(e);
    return;
  }

  /* text layer */
  try{
    const tc = await page.getTextContent();

    tlEl.innerHTML = "";
    tlEl.style.width = `${dw}px`;
    tlEl.style.height = `${dh}px`;
    tlEl.style.setProperty("--scale-factor", final);

    tlt = pdfjsLib.renderTextLayer({
      textContentSource: tc,
      container: tlEl,
      viewport: vp,
      textDivs: []
    });

    await tlt.promise;
  }catch(e){
    console.error("Text layer error:", e);
  }

  pg = n;
  document.getElementById("pgTop").textContent = n;
  document.getElementById("pgInput").value = n;
  document.getElementById("btnPrev").disabled = n <= 1;
  document.getElementById("btnNext").disabled = n >= total;
  document.getElementById("zlabel").textContent = Math.round(zoom * 100) + "%";

  if(zoom <= 1.05){
    stage.scrollTop = 0;
    stage.scrollLeft = Math.max((dw - stage.clientWidth) / 2, 0);
  }

    if(speakAfter && ttsActive){
    stopTTS(false);
    setTimeout(() => startTTS(n), 400); // small delay lets canvas settle
  }
}

/* ── NAV ── */
function nextPage(){
  if(pdfDoc && pg < total){
    stage.scrollTop = 0;
    stage.scrollLeft = 0;
    renderPage(pg + 1, true); // true = auto-speak if TTS active
  }
}

function prevPage(){
  if(pdfDoc && pg > 1){
    stage.scrollTop = 0;
    stage.scrollLeft = 0;
    renderPage(pg - 1, true);
  }
}

function jumpPage(v){
  const n = parseInt(v);
  if(!isNaN(n) && n >= 1 && n <= total) renderPage(n, true);
}
function zoomIn(){zoom=Math.min(zoom+0.25,4);renderPage(pg);}
function zoomOut(){zoom=Math.max(zoom-0.25,0.5);renderPage(pg);}
function setFit(m){fit=m;zoom=1;stage.scrollTop=0;stage.scrollLeft=0;renderPage(pg);}

/* ── UI ── */
// function toggleUI(){
//   uiOn=!uiOn;
//   document.getElementById("topBar").classList.toggle("hidden",!uiOn);
//   document.getElementById("navBar").classList.toggle("hidden",!uiOn);
//   stage.classList.toggle("fs",!uiOn);

// Remove the old touchend listener on stage and replace with this:
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

stage.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

stage.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;

  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  // Double-tap to zoom (keep your existing behaviour)
  const now = Date.now();
  const gap = now - lastTap;
  if (gap < 300 && gap > 0 && absDx < 20 && absDy < 20) {
    zoom = zoom < 1.8 ? 2 : 1;
    if (zoom === 1) fit = "readable";
    renderPage(pg);
    e.preventDefault();
    lastTap = 0; // reset so triple-tap doesn't re-trigger
    return;
  }
  lastTap = now;

  // Swipe — must be fast (<350ms), mostly horizontal, and long enough (>50px)
  if (dt > 350) return;           // too slow = scroll, not swipe
  if (absDx < 50) return;         // too short
  if (absDy > absDx * 0.8) return; // too vertical (user is scrolling)

  // If zoomed in and page is wider than screen, only swipe at edges
  if (zoom > 1.05) {
    const atLeft  = stage.scrollLeft < 10;
    const atRight = stage.scrollLeft + stage.clientWidth >= stage.scrollWidth - 10;
    if (dx < 0 && !atRight) return; // swiping left but not at right edge
    if (dx > 0 && !atLeft)  return; // swiping right but not at left edge
  }

  if (dx < 0) {
    nextPage(); // swipe left → next page
  } else {
    prevPage(); // swipe right → previous page
  }

  e.preventDefault();
}, { passive: false });


document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown") nextPage();
  if(e.key==="ArrowLeft"||e.key==="PageUp") prevPage();
  if(e.key==="Escape"){closeModal();closeDrawer();if(!uiOn)toggleUI();}
  if(e.key==="+"||e.key==="=") zoomIn();
  if(e.key==="-") zoomOut();
  if(e.key==="Enter"){const i=document.getElementById("askInput");if(i&&document.activeElement===i) askQ();}
});

function norm(t){return(t||"").toLowerCase().replace(/\s+/g," ").trim();}
function esc(t){return(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function listH(arr){if(!arr?.length) return"<p style='color:var(--muted)'>No data.</p>";
  return`<ul class="slist">${arr.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;}

function showSummary(){
  if(previewMode){alert("Login required.");return;}
  if(!sumLoaded){alert("Summaries loading…");return;}
  openModal(`Study Helper — Page ${pg}`,"<p class='loading-txt'>Analysing page…</p>");
  fetch(`/page_text/${pdfName}/${pg}`).then(r=>r.json()).then(data=>{

    let ms=[];
    for(const k in sumData.sections){
      const s=sumData.sections[k];const t=norm(s.title||k);
      if(t&&txt.includes(t.substring(0,Math.min(t.length,40)))) ms.push(s);
    }
    if(!ms.length) for(const k in sumData.sections){
      const s=sumData.sections[k];if(pg>=s.start_page&&pg<=s.end_page) ms.push(s);
    }
    const seen=new Set();ms=ms.filter(s=>{if(seen.has(s.title))return false;seen.add(s.title);return true;});
    matched=ms[0]||{main_idea:sumData.global_summary||"No summary.",key_points:[],steps:[],formulae:[],code_snippet:[],comparison_points:[],definitions:[],examples:[],exam_questions:[]};
    const cats=[["summary","Summary"],["points","Key Points"],["steps","Steps"],["formula","Formula"],["code","Code"],["comparison","Comparison"],["definitions","Definitions"],["examples","Examples"],["exam","Exam Qs"]];
    document.getElementById("mbody").innerHTML=`
      <div class="chips"><span class="chip">Page ${pg}</span><span class="chip">${esc(matched.title||"General")}</span></div>
      <div class="qgrid" id="catG">${cats.map(([k,l])=>`<button class="qb" data-c="${k}" onclick="showCat('${k}')">${l}</button>`).join("")}</div>
      <div class="abox" id="abox"><p style="color:var(--muted)">Select a category above.</p></div>`;
    showCat("summary");
  }).catch(()=>{document.getElementById("mbody").innerHTML="<p style='color:var(--muted)'>Error.</p>";});
}
function showCat(c){
  document.querySelectorAll("#catG .qb").forEach(b=>b.classList.toggle("on",b.dataset.c===c));
  const s=matched,box=document.getElementById("abox");if(!s){box.innerHTML="<p>No data.</p>";return;}
  let h="";
  if(c==="summary")    h=`<p>${esc(s.main_idea||"No summary.")}</p>`;
  else if(c==="points")     h=listH(s.key_points);
  else if(c==="steps")      h=listH(s.steps);
  else if(c==="formula")    h=s.formulae?.length?s.formulae.map(f=>`<div class="fbox">${esc(f)}</div>`).join(""):"<p style='color:var(--muted)'>No formula.</p>";
  else if(c==="code")       h=s.code_snippet?.length?`<div class="cbox">${esc(s.code_snippet.join("\n"))}</div>`:"<p style='color:var(--muted)'>No code.</p>";
  else if(c==="comparison") h=listH(s.comparison_points);
  else if(c==="definitions")h=s.definitions?.length?s.definitions.map(d=>`<p><b>${esc(d.term||"")}</b>: ${esc(d.meaning||"")}</p>`).join(""):"<p style='color:var(--muted)'>No definitions.</p>";
  else if(c==="examples")   h=listH(s.examples);
  else if(c==="exam")       h=listH(s.exam_questions);
  box.innerHTML=h||"<p style='color:var(--muted)'>No data.</p>";
}

function askQ(){

  document.getElementById("askAns").innerHTML = "<p class='loading-txt'>Searching…</p>";

  });

  fetch("/ask_book", {
    method: "POST",

  .then(r => r.json())
  .then(d => {

/* ── VIDEOS ── */
function getYTId(url){
  if(!url) return null;
  const patterns = [
    /youtube\.com\/embed\/([^?&/]+)/,
    /youtube\.com\/watch\?v=([^?&/]+)/,
    /youtu\.be\/([^?&/]+)/,
    /youtube\.com\/v\/([^?&/]+)/,
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return url;
}


function getVideos(){
  if(previewMode){alert("Login required.");return;}
  const vp=document.getElementById("vp");
  document.getElementById("vptitle").textContent=`Videos — Page ${pg}`;
  document.getElementById("vpbody").innerHTML="<p class='loading-txt'>Finding videos…</p>";
  vp.style.display="block";

  fetch(`/page_text/${pdfName}/${pg}`).then(r=>r.json()).then(data=>{
    const txt=data.text||"";
    if(!txt.trim()){
      document.getElementById("vpbody").innerHTML="<p class='loading-txt'>No text on this page.</p>";
      return;
    }

    fetch("/ai_videos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:txt})})
    .then(r=>r.json()).then(d=>{
      let h="";

      if(d.topics?.length)
  h+=`<p style="font-size:12px;color:#888;font-weight:600;margin-bottom:12px;letter-spacing:0.04em;text-transform:uppercase">${d.topics.join(" · ")}</p>`;

      // Deduplicate by URL
      const seen = new Set();
      const unique = (d.videos||[]).filter(v => {
      const id = getYTId(v.url);
      if(!id || seen.has(id)) return false;
      seen.add(id);
      return true;
    });

      if(!unique.length){
        h+="<p class='loading-txt'>No videos found.</p>";
      } else {
        unique.forEach(v => {
        h+=`<div class="vc">
          <iframe src="${v.url}" frameborder="0" allowfullscreen></iframe>
          <div class="vc-info">
            <h4>${esc(v.title)}</h4>
            <p>${esc(v.matched_topic||"General")}</p>
          </div>
        </div>`;
      });
      }

      document.getElementById("vpbody").innerHTML=h;
    }).catch(()=>{
      document.getElementById("vpbody").innerHTML="<p class='loading-txt'>Error.</p>";
    });

  }).catch(()=>{
    document.getElementById("vpbody").innerHTML="<p class='loading-txt'>Error.</p>";
  });
}

function doGoto(n){
  const target = n ?? parseInt(document.getElementById("gotoInput")?.value);
  if(isNaN(target) || target < 1 || target > total){
    announce(`Please enter a page between 1 and ${total}`);
    return;
  }
  closeModal();
  stage.scrollTop = 0;
  stage.scrollLeft = 0;
  renderPage(target, true); // true = auto-speak if TTS active
}

<script>
/* ── TEXT-TO-SPEECH ENGINE ── */
const synth = window.speechSynthesis;
let ttsUtterance = null;
let ttsActive = false;
let ttsRate = 1;
let ttsPitch = 1;
let ttsVoice = null;
let ttsAutoAdvance = true;
let ttsHighlight = true;
let ttsWordIndex = 0;
let ttsSpans = [];

/* Live region for screen readers */
const liveRegion = document.createElement("div");
liveRegion.setAttribute("aria-live", "polite");
liveRegion.setAttribute("aria-atomic", "true");
liveRegion.className = "sr-only";
liveRegion.style.cssText = "position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;";
document.body.appendChild(liveRegion);

function announce(msg) { liveRegion.textContent = ""; setTimeout(() => liveRegion.textContent = msg, 50); }

/* Load voices (async on some browsers) */
let voices = [];
function loadVoices() {
  voices = synth.getVoices().filter(v => v.lang.startsWith("en"));
  if (!voices.length) voices = synth.getVoices();
  ttsVoice = voices[0] || null;
}
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

/* Fetch current page text then speak */
function startTTS(pageNum) {
  stopTTS(false);
  fetch(`/page_text/${pdfName}/${pageNum}`)
    .then(r => r.json())
    .then(d => {
      const text = (d.text || "").trim();
      if (!text) { announce("No readable text on this page."); return; }

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.rate = ttsRate;
      ttsUtterance.pitch = ttsPitch;
      if (ttsVoice) ttsUtterance.voice = ttsVoice;

      /* Word highlight */
      // if (ttsHighlight) {
      //   ttsSpans = Array.from(tlEl.querySelectorAll("span"));
      //   ttsWordIndex = 0;
      //   ttsUtterance.onboundary = e => {
      //     if (e.name !== "word") return;
      //     ttsSpans.forEach(s => s.style.background = "");
      //     /* highlight nearest span by char offset (approximate) */
      //     const charPos = e.charIndex;
      //     let acc = 0, best = null;
      //     ttsSpans.forEach(s => {
      //       const len = (s.textContent || "").length + 1;
      //       if (acc <= charPos && charPos < acc + len) best = s;
      //       acc += len;
      //     });
      //     if (best) {
      //       best.style.background = "rgba(99,102,241,0.45)";
      //       best.style.borderRadius = "3px";
      //       best.scrollIntoView({ behavior: "smooth", block: "nearest" });
      //     }
      //   };
      // }

      ttsUtterance.onend = () => {
        clearHighlights();
        if (ttsAutoAdvance && pg < total) {
          nextPage();
          /* small delay lets renderPage settle */
          setTimeout(() => startTTS(pg), 800);
        } else {
          setTTSBtn(false);
          announce("Finished reading.");
        }
      };

      ttsUtterance.onerror = () => { setTTSBtn(false); announce("Speech error."); };

      synth.speak(ttsUtterance);
      ttsActive = true;
      setTTSBtn(true);
      announce(`Reading page ${pageNum}`);
    })
    .catch(() => announce("Could not load page text."));
}

function stopTTS(withAnnounce = true) {
  synth.cancel();
  ttsActive = false;
  clearHighlights();
  setTTSBtn(false);
  if (withAnnounce) announce("Stopped reading.");
}

function pauseTTS() {
  if (synth.speaking && !synth.paused) { synth.pause(); announce("Paused."); }
  else if (synth.paused) { synth.resume(); announce("Resumed."); }
}

function toggleTTS() {
  if (ttsActive) { stopTTS(); } else { startTTS(pg); }
}

function clearHighlights() {
  ttsSpans.forEach(s => s.style.background = "");
  ttsSpans = [];
}

function setTTSBtn(on) {
  const btn = document.getElementById("ttsBtn");
  if (!btn) return;
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.style.background = on ? "linear-gradient(135deg,var(--acc),var(--acc2))" : "";
  btn.style.color = on ? "#fff" : "";
  btn.title = on ? "Stop reading (S)" : "Read aloud (S)";
}

/* Keyboard shortcuts */
document.addEventListener("keydown", e => {
  if (document.activeElement?.tagName === "INPUT") return;
  if (e.key === "s" || e.key === "S") { e.preventDefault(); toggleTTS(); }
  if (e.key === "[") { ttsRate = Math.max(0.5, +(ttsRate - 0.25).toFixed(2)); if (ttsActive) { stopTTS(false); startTTS(pg); } }
  if (e.key === "]") { ttsRate = Math.min(2, +(ttsRate + 0.25).toFixed(2)); if (ttsActive) { stopTTS(false); startTTS(pg); } }
  if (e.key === "p" || e.key === "P") { if (ttsActive) pauseTTS(); }
});

        <select style="width:100%;padding:8px;border-radius:8px;background:var(--surf2);border:1px solid var(--bdr);color:var(--white);font-size:13px"
          onchange="ttsVoice=voices[this.value]" aria-label="Select voice">
          ${voiceOpts || "<option>Default voice</option>"}
        </select>
      </div>

      <!--<div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px">Word highlight while reading</span>
        <label style="position:relative;display:inline-block;width:44px;height:24px">
          <input type="checkbox" ${ttsHighlight?"checked":""}

          <span onclick="this.previousElementSibling.click()" style="position:absolute;cursor:pointer;inset:0;background:${ttsHighlight?"var(--acc)":"var(--surf2)"};border-radius:999px;transition:.2s">
            <span style="position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;transform:${ttsHighlight?"translateX(20px)":"none"}"></span>
          </span>
        </label>
      </div>-->

      <p style="font-size:11px;color:var(--muted);margin-top:4px">

      </p>
    </div>
  `);
}
</script>
