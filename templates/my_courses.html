<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses — KKHSOU</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:#1a1a2e; --ink-soft:#3d3d5c; --muted:#8888aa;
            --bg:#f4f3ef; --card:#ffffff;
            --accent:#2d3a8c; --accent-lt:#eef0fb;
            --gold:#c9a84c; --border:#e2e1d9;
            --green:#1a6e44; --green-lt:#e6f4ed;
            --amber:#7a3b00; --amber-lt:#fdf0e3;
            --red:#b03030; --red-lt:#fdeaea;
            --radius:10px;
            --c-dsc:#2d3a8c; --c-dse:#1a6e44; --c-aec:#7a3b00;
            --c-vac:#61176e; --c-ge:#005578; --c-sec:#3d4200;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

        /* HEADER */
        .header{background:var(--ink);height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:100}
        .logo{font-family:'Playfair Display',serif;color:#fff;font-size:1.15rem;letter-spacing:.04em}
        .logo em{color:var(--gold);font-style:normal}
        .nav{display:flex;align-items:center;gap:8px}
        .nav a{color:rgba(255,255,255,.5);text-decoration:none;font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:6px;transition:all .2s}
        .nav a:hover{color:var(--gold)}
        .nav a.active{color:#fff;background:rgba(255,255,255,.1)}
        .nav-divider{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 4px}
        .nav-user{color:rgba(255,255,255,.6);font-size:.8rem;display:flex;align-items:center;gap:6px}
        .nav-user-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
        .nav a.active{color:#fff;background:rgba(255,255,255,.1)}
        .nav-divider{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 4px}
        .nav-user{color:rgba(255,255,255,.6);font-size:.8rem;display:flex;align-items:center;gap:6px}
        .nav-user-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}

        /* HERO */
        .hero{background:var(--accent);padding:44px 40px 36px;position:relative;overflow:hidden}
        .hero::before{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.04);right:-60px;top:-80px}
        .hero-eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
        .hero-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
        .hero h1{font-family:'Playfair Display',serif;font-size:2rem;color:#fff;margin-bottom:6px}
        .hero-sub{color:rgba(255,255,255,.5);font-size:.88rem;font-weight:300}
        .hero-badge{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 18px;text-align:right;flex-shrink:0}
        .hero-badge-prog{color:#fff;font-size:.9rem;font-weight:600}
        .hero-badge-sem{color:rgba(255,255,255,.5);font-size:.72rem;margin-top:2px}

        /* TABS */
        .tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 40px;display:flex;position:sticky;top:62px;z-index:90;box-shadow:0 2px 8px rgba(26,26,46,.05)}
        .tab{font-size:.8rem;font-weight:500;padding:14px 18px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
        .tab:hover{color:var(--ink)}
        .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

        /* CONTENT */
        .content{max-width:1080px;margin:0 auto;padding:32px 40px 80px}

        /* LOADING */
        .loading{text-align:center;padding:60px 20px}
        .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
        .loading p{color:var(--muted);font-size:.86rem}

        /* STATS */
        .stats{display:flex;gap:0;margin-bottom:28px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
        .stat{flex:1;padding:16px 20px;text-align:center;border-right:1px solid var(--border)}
        .stat:last-child{border-right:none}
        .stat-n{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--accent)}
        .stat-l{font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}

        /* TYPE GROUP */
        .tgroup{margin-bottom:28px;animation:fadeUp .4s ease both}
        .tgroup:nth-child(2){animation-delay:.04s}
        .tgroup:nth-child(3){animation-delay:.08s}
        .tgroup:nth-child(4){animation-delay:.12s}
        .tgroup-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .tbadge{font-size:.65rem;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:5px;color:#fff}
        .tbadge.DSC{background:var(--c-dsc)}.tbadge.DSE{background:var(--c-dse)}
        .tbadge.AEC{background:var(--c-aec)}.tbadge.VAC{background:var(--c-vac)}
        .tbadge.GE{background:var(--c-ge)}.tbadge.SEC{background:var(--c-sec)}
        .tgroup-label{color:var(--muted);font-size:.76rem;font-weight:500}
        .tgroup-line{flex:1;height:1px;background:var(--border)}

        /* PAPER CARD */
        .paper{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s,border-color .2s}
        .paper:hover{box-shadow:0 4px 20px rgba(26,26,46,.08)}
        .paper.open{border-color:#c8c7c0}
        .paper-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none}
        .paper-num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);font-size:.7rem;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .paper-name{flex:1;font-size:.9rem;font-weight:500;color:var(--ink);line-height:1.4}
        .pdf-count{font-size:.72rem;color:var(--muted);white-space:nowrap}
        .chev{width:18px;height:18px;transition:transform .22s;color:var(--muted);flex-shrink:0}
        .paper.open .chev{transform:rotate(180deg)}

        /* PDF LIST */
        .pdf-list{display:none;border-top:1px solid var(--border);background:#fafaf8}
        .paper.open .pdf-list{display:block;animation:slideDown .18s ease}
        .pdf-row{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 56px;border-bottom:1px solid var(--border);transition:background .12s}
        .pdf-row:last-child{border-bottom:none}
        .pdf-row:hover{background:#f0efe8}
        .pdf-icon{width:30px;height:34px;background:#fff;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
        .pdf-icon::after{content:'';position:absolute;top:0;right:0;border-left:7px solid var(--bg);border-bottom:7px solid var(--border);width:0;height:0}
        .pdf-icon svg{width:13px;height:13px;color:var(--red)}
        .pdf-meta{flex:1;min-width:0}
        .pdf-title{font-size:.84rem;font-weight:500;color:var(--ink)}
        .pdf-status{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:500;margin-top:3px;padding:2px 8px;border-radius:10px}
        .pdf-status.ready{background:var(--green-lt);color:var(--green)}
        .pdf-status.pending{background:var(--amber-lt);color:var(--amber)}
        .pdf-status.processing{background:var(--accent-lt);color:var(--accent)}
        .pdf-actions{display:flex;gap:7px;flex-shrink:0}
        .btn{font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 13px;border-radius:6px;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .14s;white-space:nowrap}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-primary:hover{background:#222d70}
        .btn-outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
        .btn-outline:hover{background:var(--accent-lt)}
        .btn-muted{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
        .btn:disabled{opacity:.4;cursor:not-allowed}

        /* EMPTY */
        .empty{text-align:center;padding:70px 20px;animation:fadeUp .4s ease}
        .empty svg{opacity:.18;margin-bottom:16px}
        .empty h3{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--ink-soft);margin-bottom:8px}
        .empty p{color:var(--muted);font-size:.86rem}

        /* SEMESTER SWITCHER */
        .sem-switcher{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
        .sem-btn{font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
        .sem-btn:hover{border-color:var(--accent);color:var(--accent)}
        .sem-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}

        @media(max-width:640px){
            .header{padding:0 16px}.nav .nav-user{display:none}
            .hero{padding:28px 16px}.hero-badge{display:none}
            .tabs{padding:0 16px;overflow-x:auto}
            .content{padding:20px 14px 60px}
            .pdf-row{padding-left:16px;flex-wrap:wrap}
            .stats{flex-wrap:wrap}
        }

        /* ── MOBILE NAV ── */
        .hamburger{display:none;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.75);padding:6px;flex-direction:column;gap:5px;align-items:center}
        .hamburger span{display:block;width:22px;height:2px;background:currentColor;border-radius:2px}
        .mobile-nav-drawer{display:none;position:fixed;inset:0;z-index:300}
        .mobile-nav-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
        .mobile-nav-panel{position:absolute;top:0;right:0;width:min(280px,85vw);height:100%;background:var(--ink);border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.4);overflow-y:auto}
        .mobile-nav-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
        .mobile-nav-user{display:flex;align-items:center;gap:10px}
        .mobile-nav-user-dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
        .mobile-nav-name{color:rgba(255,255,255,.75);font-size:.88rem;font-weight:500}
        .mobile-nav-close{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:rgba(255,255,255,.6);font-size:18px;display:flex;align-items:center;justify-content:center}
        .mobile-nav-links{padding:12px 0;flex:1}
        .mobile-nav-links a{display:block;padding:13px 20px;color:rgba(255,255,255,.55);text-decoration:none;font-size:.9rem;font-weight:500;border-left:3px solid transparent;transition:all .15s}
        .mobile-nav-links a:hover{color:#fff;background:rgba(255,255,255,.05)}
        .mobile-nav-links a.active{color:#fff;border-left-color:var(--gold);background:rgba(255,255,255,.06)}
        .mobile-nav-links a.logout{color:rgba(255,100,100,.7);margin-top:8px}
        .mobile-nav-drawer.open{display:block}

        @media(max-width:640px){
            .hamburger{display:flex}
            .nav{display:none}
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">KK<em>H</em>SOU</div>
    <nav class="nav">
        <div class="nav-user"><div class="nav-user-dot"></div><span id="navName">Student</span></div>
        <div class="nav-divider"></div>
        <a href="/my-courses" class="active">My Courses</a>
        <!-- <a href="/library">All Courses</a> -->
        <!-- <a href="/books">All Books</a> -->
        <a href="/logout">Log Out</a>
    </nav>
    <button class="hamburger" onclick="openMobileNav()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
</header>

<div class="mobile-nav-drawer" id="mobileNavDrawer">
    <div class="mobile-nav-overlay" onclick="closeMobileNav()"></div>
    <div class="mobile-nav-panel">
        <div class="mobile-nav-header">
            <div class="mobile-nav-user">
                <div class="mobile-nav-user-dot"></div>
                <span class="mobile-nav-name" id="mobileNavName">Student</span>
            </div>
            <button class="mobile-nav-close" onclick="closeMobileNav()">✕</button>
        </div>
        <div class="mobile-nav-links">
            <a href="/my-courses" class="active">My Courses</a>
            <!-- <a href="/library">All Courses</a> -->
            <a href="/books">All Books</a>
            <a href="/logout" class="logout">Log Out</a>
        </div>
    </div>
</div>

<div class="hero">
    <div class="hero-eyebrow">Student Dashboard</div>
    <div class="hero-row">
        <div>
            <h1 id="heroName">My Course Materials</h1>
            <div class="hero-sub" id="heroSub">Loading your programme…</div>
        </div>
        <div class="hero-badge" id="heroBadge" style="display:none">
            <div class="hero-badge-prog" id="badgeProg">—</div>
            <div class="hero-badge-sem" id="badgeSem">—</div>
        </div>
    </div>
</div>

<div class="tabs">
    <a class="tab active" href="/my-courses">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        My Courses
    </a>
    <!-- <a class="tab" href="/library">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        All Programmes
    </a>
    <a class="tab" href="/books">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        All Books
    </a> -->
</div>

<div class="content">
    <div id="stateLoading" class="loading">
        <div class="spinner"></div>
        <p>Loading your course materials…</p>
    </div>
    <div id="stateContent" style="display:none"></div>
    <div id="stateEmpty" class="empty" style="display:none">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
            <rect x="10" y="8" width="38" height="50" rx="4" fill="#1a1a2e" opacity=".12"/>
            <rect x="18" y="14" width="38" height="50" rx="4" fill="#1a1a2e" opacity=".18"/>
            <rect x="26" y="20" width="38" height="50" rx="4" fill="#1a1a2e" opacity=".28"/>
        </svg>
        <h3>No materials available yet</h3>
        <p>Your course materials haven't been uploaded yet. Check back soon!</p>
    </div>
</div>

<script>
const TYPE_LABELS = {
    DSC:"Discipline Specific Core", DSE:"Discipline Specific Elective",
    AEC:"Ability Enhancement Compulsory", VAC:"Value Added Course",
    GE:"Generic Elective", SEC:"Skill Enhancement Course"
};

let currentProgId = null;
let currentSem    = null;
let allSemesters  = [];

window.addEventListener("DOMContentLoaded", async () => {

    // ADD THIS at the top:
    try {
        const info = await apiFetch("/api/my-info");
        document.getElementById("navName").textContent = info.full_name;
    } catch(e) {}

    // Get student info from session via a lightweight API call
    const info = await apiFetch("/api/my-info");

    // Update header & hero
    document.getElementById("navName").textContent   = info.full_name;
    document.getElementById("heroName").textContent  = `Hello, ${info.full_name.split(" ")[0]}`;
    document.getElementById("heroSub").textContent   = info.programme
        ? `${info.programme.name} — Semester ${info.semester}`
        : "Browse all your course materials below";

    if (info.programme) {
        document.getElementById("badgeProg").textContent = info.programme.code;
        document.getElementById("badgeSem").textContent  = `Semester ${info.semester}`;
        document.getElementById("heroBadge").style.display = "block";
    }

    currentProgId = info.programme_id;
    currentSem    = info.semester;

    if (info.is_admin) {
        // Admin sees a programme/semester selector like the library page
        renderAdminView();
        return;
    }

    // Load all available semesters for this programme
    if (info.programme_id) {
        allSemesters = await apiFetch(`/api/semesters/${info.programme_id}`);
        await loadSemester(info.programme_id, info.semester);
    } else {
        showState("empty");
    }
});

async function loadSemester(progId, sem) {
    showState("loading");
    currentSem = sem;

    const data = await apiFetch(`/api/papers/${progId}/${sem}`);
    renderContent(data);
    showState("content");
}

function renderContent(data) {
    const area = document.getElementById("stateContent");
    area.innerHTML = "";

    // Semester switcher (if multiple semesters available)
    if (allSemesters.length > 1) {
        const sw = document.createElement("div");
        sw.className = "sem-switcher";
        allSemesters.forEach(s => {
            sw.innerHTML += `
                <button class="sem-btn ${s === currentSem ? 'active' : ''}"
                        onclick="loadSemester(${currentProgId}, ${s})">
                    Semester ${s}
                </button>`;
        });
        area.appendChild(sw);
    }

    // Stats
    const st = data.stats;
    area.innerHTML += `
        <div class="stats">
            <div class="stat"><div class="stat-n">${data.groups.length}</div><div class="stat-l">Paper Types</div></div>
            <div class="stat"><div class="stat-n">${st.total_papers}</div><div class="stat-l">Papers</div></div>
            <div class="stat"><div class="stat-n">${st.total_pdfs}</div><div class="stat-l">Materials</div></div>
            <div class="stat"><div class="stat-n">${st.ready_pdfs}</div><div class="stat-l">Ready to Read</div></div>
        </div>`;

    if (st.total_pdfs === 0) { showState("empty"); return; }

    // Groups
    let pIdx = 0;
    data.groups.forEach(grp => {
        const gEl = document.createElement("div");
        gEl.className = "tgroup";

        let papersHTML = "";
        grp.papers.forEach(paper => {
            pIdx++;
            const total = paper.pdfs.length;
            const ready = paper.pdfs.filter(p => p.status === "ready").length;

            const pdfsHTML = paper.pdfs.map(pdf => {
                const st    = pdf.status;
                const sIcon = {ready:"✓", pending:"⏳", processing:"⟳", failed:"✕"}[st] || "–";
                const sLbl  = {ready:"Ready", pending:"Coming soon", processing:"Processing…", failed:"Unavailable"}[st] || st;

                return `
                <div class="pdf-row">
                    <div class="pdf-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <div class="pdf-meta">
                        <div class="pdf-title">${pdf.title}</div>
                        <span class="pdf-status ${st}">${sIcon} ${sLbl}</span>
                    </div>
                    <div class="pdf-actions">
                        ${st === 'ready'
                            ? `<a href="/flipbook/${encodeURIComponent(pdf.pdf_name)}" class="btn btn-primary">
                                   <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>
                                   Read
                               </a>`
                            : `<button class="btn btn-muted" disabled>Not available</button>`
                        }
                    </div>
                </div>`;
            }).join("");

            papersHTML += `
            <div class="paper" id="p${paper.id}">
                <div class="paper-hd" onclick="toggle(${paper.id})">
                    <div class="paper-num">${pIdx}</div>
                    <div class="paper-name">${paper.paper_name}</div>
                    <div class="pdf-count">${ready}/${total} ready</div>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
                <div class="pdf-list">${pdfsHTML}</div>
            </div>`;
        });

        gEl.innerHTML = `
            <div class="tgroup-hd">
                <span class="tbadge ${grp.type}">${grp.type}</span>
                <span class="tgroup-label">${TYPE_LABELS[grp.type] || grp.type}</span>
                <div class="tgroup-line"></div>
            </div>
            ${papersHTML}`;
        area.appendChild(gEl);
    });
}

function renderAdminView() {
    // Admins get redirected to the full library
    window.location.href = "/library";
}

function toggle(id) {
    document.getElementById(`p${id}`).classList.toggle("open");
}

function showState(w) {
    document.getElementById("stateLoading").style.display = w==="loading" ? "block":"none";
    document.getElementById("stateContent").style.display = w==="content" ? "block":"none";
    document.getElementById("stateEmpty").style.display   = w==="empty"   ? "block":"none";
}

async function apiFetch(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}


function openMobileNav() {
    document.getElementById("mobileNavDrawer").classList.add("open");
    document.body.style.overflow = "hidden";
}
function closeMobileNav() {
    document.getElementById("mobileNavDrawer").classList.remove("open");
    document.body.style.overflow = "";
}
// Keep mobile name in sync with desktop navName
const _dn = document.getElementById("navName");
const _mn = document.getElementById("mobileNavName");
if (_dn && _mn) {
    new MutationObserver(() => _mn.textContent = _dn.textContent)
        .observe(_dn, { childList: true, characterData: true, subtree: true });
}
</script>
